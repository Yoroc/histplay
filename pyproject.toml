[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "histplay"
version = "0.1.0"
description = "Turn shell history into a clean, replayable session script"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Yoroc"}
]
keywords = ["cli", "history", "shell", "automation", "devtools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.9.0"
]

[project.urls]
Homepage = "https://github.com/Yoroc/histplay"
Repository = "https://github.com/Yoroc/histplay.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["histplay*"]

[tool.setuptools.package-data]
histplay = ["py.typed"]